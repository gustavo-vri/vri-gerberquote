# Gera os instaladores do VRI GerberQuote automaticamente na nuvem do GitHub.
#  - Windows 10/11 x64: instalador .exe (Inno Setup)
#  - macOS Apple Silicon (arm64) e macOS Intel (x86_64): .dmg
# Disparo: aba "Actions" > "Build instaladores" > "Run workflow", ou ao criar uma tag v* (ex.: v1.1.0),
# que também publica os instaladores numa Release.
name: Build instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - run: pip install -r requirements.txt
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Dependências
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: PyInstaller
        run: pyinstaller packaging/vri_gerberquote.spec --noconfirm --clean
      - name: Teste do executável (gera PDF sem interface)
        shell: pwsh
        run: |
          python -m tests.synthetic
          $p = Start-Process -FilePath "dist/VRI_GerberQuote/VRI_GerberQuote.exe" -ArgumentList "exemplos/cenario1_4L_SMDtop_PTH.zip","--pdf","teste.pdf" -Wait -PassThru
          if (!(Test-Path teste.pdf)) { throw "Executável não gerou o PDF (código $($p.ExitCode))" }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (!(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $ver = (Select-String -Path core/version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" packaging/windows/VRI_GerberQuote.iss
      - uses: actions/upload-artifact@v4
        with:
          name: VRI_GerberQuote_Windows
          path: dist/installer/*.exe

  macos:
    needs: tests
    strategy:
      matrix:
        os: [macos-15, macos-15-intel]   # Apple Silicon e Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build .app + .dmg
        run: bash packaging/macos/build_macos.sh
      - name: Teste do executável (gera PDF sem interface)
        run: |
          source .venv-build/bin/activate && python -m tests.synthetic
          "dist/VRI GerberQuote.app/Contents/MacOS/VRI_GerberQuote" exemplos/cenario1_4L_SMDtop_PTH.zip --pdf teste.pdf
          test -s teste.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: VRI_GerberQuote_macOS_${{ matrix.os }}
          path: dist/installer/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artefatos, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artefatos/*
